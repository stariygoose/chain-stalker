version: '3.8'

services:

  # nginx:
  #   image: nginx:1.27.3
  #   depends_on: 
  #     - bot
  #     - server
  #     - client
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./client/dist:/usr/share/nginx/html:ro
  #   ports:
  #     - ${TUNNEL_PORT}:${TUNNEL_PORT}
  #   networks:
  #     - ${NODE_MODE}

  ngrok:
    image: ngrok/ngrok:latest
    volumes:
      - ./ngrok.yml:/var/lib/ngrok/ngrok.yml
    command: ["start", "chainstalker", "--authtoken", "${NGROK_TOKEN}"]
    networks:
      - ${NODE_MODE}
    ports:
      - 8080:8080

  bot:
    build:
      context: ./bot
    depends_on:
      - server
    environment:
      - NODE_MODE=${NODE_MODE}

      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      - TG_BOT_PORT=${TG_BOT_PORT}

      # - DOMAIN_URL=${NGROK_STATIC_DOMAIN}
      - SERVER_URL=http://server:${SERVER_PORT}

      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      - BOT_SERVICE_NAME=${BOT_SERVICE_NAME}
    env_file:
      - .env
    ports:
      - ${TG_BOT_PORT}:${TG_BOT_PORT}
    volumes:
      - ./bot/.logs:/bot/.logs
    networks:
      - ${NODE_MODE}

  server:
    build:
      context: ./server
    depends_on:
      - mongodb
      - redis
      - ngrok
    environment:
      - NODE_MODE=${NODE_MODE}

      - SERVER_PORT=${SERVER_PORT}

      - MONGODB_URL=mongodb://${DB_USER}:${DB_PASS}@mongodb:${DB_PORT}/${DB_DATABASE}?authSource=${DB_DATABASE}&directConnection=true
      - BOT_URL=http://bot:${TG_BOT_PORT}
      - DOMAIN_URL=https://pretty-casual-hound.ngrok-free.app

      - OPENSEA_TOKEN=${OPENSEA_TOKEN}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}

      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      - BOT_SERVICE_NAME=${BOT_SERVICE_NAME}

      # - MARKETPLACE_KEY_OPENSEA=${MARKETPLACE_KEY_OPENSEA}
      # - MARKETPLACE_KEY_BINANCE=${MARKETPLACE_KEY_BINANCE}
    env_file:
      - .env
    volumes:
      - ./server/.logs:/server/.logs
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    networks:
      - ${NODE_MODE}

  # client:
  #   build:
  #     context: ./client
  #   networks:
  #     - ${NODE_MODE}

  mongodb:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_DATABASE}
      MONGO_DB_USERNAME: ${DB_USER}
      MONGO_DB_PASSWORD: ${DB_PASS}
    command: ["mongod", "--config", "/config/mongod.conf"]
    volumes:
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./mongod.conf:/config/mongod.conf:ro
      - ./.volume/mongodb:/data/db
    networks:
      - ${NODE_MODE}

  redis:
    image: redis:latest
    restart: always
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}
    volumes: 
      - ./.volume/redis:/data
    networks:
      - ${NODE_MODE}

    
networks:
  dev:
    driver: bridge
    name: dev
  prod:
    driver: bridge
    name: prod

